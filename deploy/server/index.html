<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOTE4C Codex 额度</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111; color: #eee; }
    main { width: min(92vw, 720px); text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(22px, 5vw, 34px); }
    p { margin: 0 0 20px; color: #aaa; }
    img { display: block; width: 100%; max-width: 600px; margin: auto; border: 1px solid #444; image-rendering: pixelated; background: #fff; }
    #state { margin-top: 14px; font-size: 14px; color: #aaa; }
  </style>
</head>
<body>
  <main>
    <h1>Codex 三账号额度</h1>
    <p>Business / Plus · 与 NOTE4C 同步</p>
    <img id="quota" alt="Codex 三账号额度看板" width="400" height="300">
    <div id="state">正在读取最新数据…</div>
  </main>
  <script>
    async function refresh() {
      const state = document.getElementById('state');
      try {
        const response = await fetch('/manifest.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const manifest = await response.json();
        document.getElementById('quota').src = `/preview.png?v=${manifest.revision}`;
        state.textContent = `服务器更新时间：${new Date(manifest.generatedAt * 1000).toLocaleString()}`;
      } catch (error) {
        state.textContent = `读取失败：${error.message}`;
      }
    }
    refresh();
    setInterval(refresh, 60_000);
  </script>
</body>
</html>
